name: Node CI

on:
  - push
  - pull_request

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: make install
      - run: make lint
      - run: make test
